<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Газпром-Аудит: Мониторинг земляных работ (DJI L2 + Octree LOD)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0a0e14; font-family: 'Segoe UI', Tahoma, sans-serif; color: #fff; }
        
        #dashboard {
            position: absolute; top: 20px; left: 20px; width: 380px;
            background: rgba(13, 19, 28, 0.94); border: 1px solid #283344; border-radius: 8px;
            padding: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            z-index: 10;
        }
        
        h2 { margin: 0 0 12px 0; font-size: 13px; color: #58a6ff; text-transform: uppercase; border-bottom: 1px solid #283344; padding-bottom: 8px; }
        
        .badge-row { display: flex; gap: 8px; margin-bottom: 12px; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; text-transform: uppercase; }
        .scene-badge { background: #238636; color: #fff; }
        .lod-badge { background: #1f6feb; color: #fff; }

        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .metric-card { padding: 8px 10px; border-radius: 4px; background: #161f2c; border: 1px solid #2d3b4e; }
        .metric-card.cut { border-left: 3px solid #2ea043; }
        .metric-card.fill { border-left: 3px solid #da3633; }
        .metric-card.mass { grid-column: span 2; border-left: 3px solid #d29922; }

        .metric-label { font-size: 10px; color: #8b949e; text-transform: uppercase; font-weight: bold; margin-bottom: 2px; }
        .metric-value { font-size: 18px; font-weight: bold; color: #fff; }
        .metric-value.cut { color: #3fb950; }
        .metric-value.fill { color: #f85149; }
        .metric-value.mass { color: #e3b341; font-size: 22px; }
        .metric-value span { font-size: 12px; color: #8b949e; font-weight: normal; }

        .secondary-metrics {
            font-size: 11px; color: #8b949e; margin-bottom: 12px; background: #111722; padding: 7px; border-radius: 4px;
            display: flex; justify-content: space-between;
        }
        .secondary-metrics span b { color: #c9d1d9; }

        .controls-title { font-size: 10px; text-transform: uppercase; color: #8b949e; margin: 10px 0 6px 0; font-weight: bold; }
        .controls { display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto; }

        button {
            padding: 8px 10px; background: #1c2430; border: 1px solid #2d3b4e; text-align: left;
            color: #c9d1d9; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 11px;
            transition: all 0.2s ease; display: flex; justify-content: space-between; align-items: center;
        }
        button:hover { background: #283344; }
        button.active { background: #1f6feb; color: #fff; border-color: #58a6ff; }

        .btn-badge { font-size: 9px; padding: 2px 5px; border-radius: 3px; font-weight: bold; background: #283344; }
        button.active .btn-badge { background: #0a0e14; color: #58a6ff; }

        .btn-report {
            width: 100%; margin-top: 12px; padding: 10px; background: #238636; border: 1px solid #2ea043;
            color: #fff; font-weight: bold; text-align: center; justify-content: center; font-size: 11px;
        }
        .btn-report:hover { background: #2ea043; }

        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 14px; background: rgba(13, 19, 28, 0.95); padding: 15px 30px;
            border-radius: 6px; border: 1px solid #58a6ff; z-index: 100;
        }
    </style>
</head>
<body>

    <div id="loading">Синхронизация геодезических данных...</div>

    <div id="dashboard" style="display: none;">
        <h2>Оперативный маркшейдерский контроль</h2>
        <div class="badge-row">
            <div id="scene-type-badge" class="badge scene-badge">Карьер / Выемка</div>
            <div class="badge lod-badge">Zenmuse L2 (ASPRS)</div>
        </div>

        <div class="metrics-grid">
            <div class="metric-card cut">
                <div class="metric-label">Выемка (Целик)</div>
                <div class="metric-value cut" id="val-cut">+0.00 <span>м³</span></div>
            </div>
            <div class="metric-card fill">
                <div class="metric-label">Насыпь (Fill)</div>
                <div class="metric-value fill" id="val-fill">-0.00 <span>м³</span></div>
            </div>
            <div class="metric-card mass">
                <div class="metric-label">Масса перемещенной породы</div>
                <div class="metric-value mass" id="val-mass">0.0 <span>тонн</span></div>
            </div>
        </div>

        <div class="secondary-metrics">
            <span>Площадь: <b id="val-area">0.0</b> м²</span>
            <span>СКП рельефа: <b id="val-rmse">±0.000</b> м</span>
        </div>

        <div class="controls-title">Эпохи БПЛА-мониторинга:</div>
        <div class="controls" id="btn-container"></div>

        <button class="btn-report" onclick="window.open('report.html', '_blank')">Сформировать акт по форме РД 07-603-03</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        let scene, camera, renderer, controls;
        let epochsData = [];
        let epochGroups = []; 
        let boundaryLine = null;

        init();
        loadData();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0e14);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(22, 18, 22);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            const grid = new THREE.GridHelper(40, 40, 0x283344, 0x161f2c);
            scene.add(grid);

            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        function safeNum(val) {
            const num = Number(val);
            return Number.isFinite(num) ? num : 0.0;
        }

        function formatM3(val, forceSign = false) {
            const num = safeNum(val);
            const prefix = (forceSign && num > 0) ? '+' : '';
            return `${prefix}${num.toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        }

        async function loadData() {
            try {
                const metaResponse = await fetch('meta.json');
                if (!metaResponse.ok) throw new Error("meta.json не найден. Запустите расчет в консоли.");
                const metaJson = await metaResponse.json();
                epochsData = metaJson.Epochs || [];

                if (epochsData.length === 0) throw new Error("В meta.json нет эпох.");

                const sceneBadge = document.getElementById('scene-type-badge');
                if (metaJson.Scene === "Warehouse") {
                    sceneBadge.innerText = "Склад МТР / Трубная база";
                    sceneBadge.style.background = "#8957e5";
                } else if (metaJson.Scene === "Crater") {
                    sceneBadge.innerText = "Котлован компрессорной станции";
                    sceneBadge.style.background = "#d29922";
                } else {
                    sceneBadge.innerText = "Карьер / Породный отвал";
                    sceneBadge.style.background = "#238636";
                }

                if (metaJson.Boundary && metaJson.Boundary.length > 0) {
                    renderBoundary(metaJson.Boundary);
                }

                const btnContainer = document.getElementById('btn-container');
                btnContainer.innerHTML = '';

                for (let i = 0; i < epochsData.length; i++) {
                    const ep = epochsData[i];
                    const epochGroup = new THREE.Group();
                    epochGroup.visible = false;
                    scene.add(epochGroup);
                    epochGroups.push(epochGroup);

                    if (ep.Octree && ep.Octree.Nodes && ep.Octree.Nodes.length > 1) {
                        const octants = ep.Octree.Nodes.filter(n => n.Level === 1);
                        for (const node of octants) {
                            fetch(node.BinFile).then(res => res.arrayBuffer()).then(buf => {
                                epochGroup.add(createPointCloud(buf));
                            }).catch(() => {});
                        }
                    } else {
                        fetch(ep.BinFile).then(res => res.arrayBuffer()).then(buf => {
                            epochGroup.add(createPointCloud(buf));
                        }).catch(() => {});
                    }

                    const btn = document.createElement('button');
                    const titleSpan = document.createElement('span');
                    titleSpan.innerText = ep.Title || `Скан ${ep.Id ?? i}`;

                    const badgeSpan = document.createElement('span');
                    badgeSpan.className = 'btn-badge';
                    if (ep.StageType === 'RAW_SCAN') {
                        badgeSpan.innerText = "ТЕХНИКА В ЗОНЕ";
                    } else if (ep.StageType === 'CLEANED_BASE' || i === 1) {
                        badgeSpan.innerText = "БАЗИС";
                    } else {
                        badgeSpan.innerText = `${formatM3(safeNum(ep.CutVolume), true)} м³`;
                    }

                    btn.appendChild(titleSpan);
                    btn.appendChild(badgeSpan);
                    btn.onclick = () => selectEpoch(i, btn);
                    btnContainer.appendChild(btn);
                }

                const targetIdx = (epochGroups.length > 1) ? 1 : 0;
                selectEpoch(targetIdx, btnContainer.children[targetIdx]);

                document.getElementById('loading').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';

            } catch (error) {
                document.getElementById('loading').innerText = "Ошибка: " + error.message;
                document.getElementById('loading').style.borderColor = "#f85149";
            }
        }

        function renderBoundary(vertices) {
            const points = [];
            // Строгое отображение полигона на геодезической плоскости (X -> Three.X, Y -> Three.Z)
            for (let i = 0; i < vertices.length; i++) {
                points.push(new THREE.Vector3(vertices[i].X, 0.3, vertices[i].Y));
            }
            points.push(new THREE.Vector3(vertices[0].X, 0.3, vertices[0].Y));

            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({ color: 0xbd93f9, linewidth: 2 });
            boundaryLine = new THREE.Line(geometry, material);
            scene.add(boundaryLine);
        }

        function selectEpoch(index, btnElement) {
            for (let i = 0; i < epochGroups.length; i++) {
                epochGroups[i].visible = (i === index);
            }

            const buttons = document.getElementById('btn-container').children;
            for (let i = 0; i < buttons.length; i++) buttons[i].classList.remove('active');
            if (btnElement) btnElement.classList.add('active');

            const ep = epochsData[index] || {};
            const cutVal = safeNum(ep.CutVolume);
            const fillVal = safeNum(ep.FillVolume);
            const massVal = safeNum(ep.WeightTon);
            const areaVal = safeNum(ep.AreaCut);
            const rmseVal = safeNum(ep.Rmse);

            document.getElementById('val-cut').innerHTML = `${formatM3(cutVal, true)} <span>м³</span>`;
            document.getElementById('val-fill').innerHTML = `-${formatM3(fillVal)} <span>м³</span>`;
            document.getElementById('val-mass').innerHTML = `${massVal.toLocaleString('ru-RU', { minimumFractionDigits: 1 })} <span>т</span>`;
            document.getElementById('val-area').innerText = areaVal.toLocaleString('ru-RU', { minimumFractionDigits: 1 });
            document.getElementById('val-rmse').innerText = `±${rmseVal.toFixed(3)}`;
        }

        function createPointCloud(buffer) {
            const POINT_STRIDE = 16;
            const numPoints = Math.floor(buffer.byteLength / POINT_STRIDE);

            const positions = new Float32Array(numPoints * 3);
            const colors = new Float32Array(numPoints * 3);
            const dataView = new DataView(buffer);

            let byteOffset = 0, pIdx = 0;

            // Конвертация: геодезический X -> X, геодезический Y -> Z, отметка Z -> Y (высота в Three.js)
            for (let i = 0; i < numPoints; i++) {
                const geoX = dataView.getFloat32(byteOffset, true);
                const geoY = dataView.getFloat32(byteOffset + 4, true);
                const geoZ = dataView.getFloat32(byteOffset + 8, true);

                positions[pIdx]     = geoX;
                positions[pIdx + 1] = geoZ; // Высота в Three.js
                positions[pIdx + 2] = geoY; // Горизонтальная ось на плоскости

                colors[pIdx]     = dataView.getUint8(byteOffset + 12) / 255.0;
                colors[pIdx + 1] = dataView.getUint8(byteOffset + 13) / 255.0;
                colors[pIdx + 2] = dataView.getUint8(byteOffset + 14) / 255.0;

                byteOffset += POINT_STRIDE;
                pIdx += 3;
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            return new THREE.Points(geometry, new THREE.PointsMaterial({ size: 0.035, vertexColors: true }));
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
