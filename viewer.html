<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Лидар-БИМ: 4D Мониторинг Выработки и Складов</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0d1117; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; }
        
        #dashboard {
            position: absolute; top: 20px; left: 20px; width: 380px;
            background: rgba(18, 24, 33, 0.94); border: 1px solid #2d3748; border-radius: 10px;
            padding: 22px 20px; box-shadow: 0 12px 35px rgba(0,0,0,0.8); backdrop-filter: blur(8px);
            z-index: 10;
        }
        
        h2 { margin: 0 0 16px 0; font-size: 15px; color: #58a6ff; text-transform: uppercase; border-bottom: 1px solid #30363d; padding-bottom: 12px; letter-spacing: 1px; }
        
        .scene-badge {
            display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 11px;
            font-weight: bold; background: #238636; color: #fff; margin-bottom: 15px; text-transform: uppercase;
        }

        .metric { margin-bottom: 18px; padding: 14px; background: rgba(56, 139, 253, 0.1); border-left: 4px solid #58a6ff; border-radius: 4px; }
        .metric-label { font-size: 12px; color: #8b949e; text-transform: uppercase; font-weight: bold; margin-bottom: 6px; }
        .metric-value { font-size: 30px; font-weight: bold; color: #58a6ff; text-shadow: 0 0 12px rgba(88, 166, 255, 0.3); }
        .metric-value span { font-size: 15px; color: #8b949e; font-weight: normal; }
        
        .stage-desc {
            font-size: 12px; color: #c9d1d9; background: #161b22; padding: 10px;
            border-radius: 6px; border: 1px solid #30363d; margin-bottom: 15px; min-height: 42px; line-height: 1.4;
        }

        .controls-title { font-size: 12px; text-transform: uppercase; color: #8b949e; margin-bottom: 8px; font-weight: bold; }
        .controls { display: flex; flex-direction: column; gap: 8px; max-height: 380px; overflow-y: auto; padding-right: 4px; }
        
        .controls::-webkit-scrollbar { width: 6px; }
        .controls::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }

        button {
            padding: 10px 12px; background: #21262d; border: 1px solid #30363d; text-align: left;
            color: #c9d1d9; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12px;
            transition: all 0.2s ease; display: flex; flex-direction: column; gap: 4px;
        }
        button:hover { background: #30363d; border-color: #8b949e; }
        button.active { background: #1f6feb; color: #fff; border-color: #58a6ff; box-shadow: 0 0 14px rgba(31, 111, 235, 0.4); }
        
        .btn-header { display: flex; justify-content: space-between; width: 100%; align-items: center; }
        .btn-badge { font-size: 10px; padding: 2px 6px; border-radius: 3px; font-weight: bold; background: #30363d; }
        button.active .btn-badge { background: #0d1117; color: #58a6ff; }
        
        .badge-raw { background: #d29922; color: #000; }
        .badge-base { background: #238636; color: #fff; }
        .badge-step { background: #8957e5; color: #fff; }

        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 16px; background: rgba(13, 17, 23, 0.9); padding: 24px 40px;
            border-radius: 8px; border: 1px solid #58a6ff; z-index: 100;
            box-shadow: 0 0 25px rgba(88, 166, 255, 0.25); text-align: center;
        }
    </style>
</head>
<body>

    <div id="loading">Загрузка облаков точек и синхронизация...</div>

    <div id="dashboard" style="display: none;">
        <h2>4D Мониторинг Объекта</h2>
        <div id="scene-type-badge" class="scene-badge">Карьер / Куча</div>
        
        <div class="metric">
            <div class="metric-label" id="metric-title">Объем извлечения / уборки</div>
            <div class="metric-value" id="val-extracted-total">0.00 <span>м³</span></div>
        </div>

        <div class="stage-desc" id="stage-description">
            Описание выбранного этапа...
        </div>

        <div class="controls-title">Технологические Этапы:</div>
        <div class="controls" id="btn-container">
            <!-- Кнопки генерируются динамически -->
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        let scene, camera, renderer, controls;
        let epochsData = [];
        let pointClouds = []; 

        init();
        loadData();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0e14);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(22, 18, 22);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            const grid = new THREE.GridHelper(45, 45, 0x2d3748, 0x161b22);
            scene.add(grid);

            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        async function loadData() {
            try {
                const metaResponse = await fetch('meta.json');
                if (!metaResponse.ok) throw new Error("Файл meta.json не найден. Сначала выполните обработку в CLI.");
                const metaJson = await metaResponse.json();
                epochsData = metaJson.Epochs;

                const sceneBadge = document.getElementById('scene-type-badge');
                if (metaJson.Scene === "Warehouse") {
                    sceneBadge.innerText = "Склад материалов и паллет";
                    sceneBadge.style.background = "#8957e5";
                    document.getElementById('metric-title').innerText = "Объем освобожденного пространства";
                } else if (metaJson.Scene === "Crater") {
                    sceneBadge.innerText = "Котлован / Кратер выемки";
                    sceneBadge.style.background = "#d29922";
                    document.getElementById('metric-title').innerText = "Объем выемки грунта";
                } else {
                    sceneBadge.innerText = "Карьер / Насыпная куча";
                    sceneBadge.style.background = "#238636";
                    document.getElementById('metric-title').innerText = "Объем извлеченной породы";
                }

                const btnContainer = document.getElementById('btn-container');

                const fetchPromises = epochsData.map(ep => fetch(ep.BinFile).then(res => res.arrayBuffer()));
                const buffers = await Promise.all(fetchPromises);

                for (let i = 0; i < epochsData.length; i++) {
                    const ep = epochsData[i];
                    
                    const cloud = createPointCloud(buffers[i]);
                    cloud.visible = (i === 1); // По умолчанию открываем Этап 2 (Базис)
                    scene.add(cloud);
                    pointClouds.push(cloud);

                    const btn = document.createElement('button');
                    
                    const headerDiv = document.createElement('div');
                    headerDiv.className = 'btn-header';
                    
                    const titleSpan = document.createElement('span');
                    titleSpan.innerText = ep.Title;

                    const badgeSpan = document.createElement('span');
                    badgeSpan.className = 'btn-badge';

                    if (ep.StageType === 'RAW_SCAN') {
                        badgeSpan.classList.add('badge-raw');
                        badgeSpan.innerText = "С ТЕХНИКОЙ";
                    } else if (ep.StageType === 'CLEANED_BASE') {
                        badgeSpan.classList.add('badge-base');
                        badgeSpan.innerText = "БАЗИС (0.0 м³)";
                    } else {
                        badgeSpan.classList.add('badge-step');
                        badgeSpan.innerText = `+${ep.ExtractedTotal.toLocaleString('ru-RU')} м³`;
                    }

                    headerDiv.appendChild(titleSpan);
                    headerDiv.appendChild(badgeSpan);
                    btn.appendChild(headerDiv);

                    if (i === 1) btn.classList.add('active');
                    
                    btn.onclick = () => selectEpoch(i, btn);
                    btnContainer.appendChild(btn);
                }

                if (pointClouds.length > 0) {
                    const initialIdx = pointClouds.length > 1 ? 1 : 0;
                    pointClouds[initialIdx].geometry.computeBoundingSphere();
                    const center = pointClouds[initialIdx].geometry.boundingSphere.center;
                    controls.target.copy(center);
                    controls.update();
                    
                    selectEpoch(initialIdx, btnContainer.children[initialIdx]); 
                }

                document.getElementById('loading').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';

            } catch (error) {
                document.getElementById('loading').innerText = "Ошибка: " + error.message;
                document.getElementById('loading').style.borderColor = "#f85149";
            }
        }

        function selectEpoch(index, btnElement) {
            for (let i = 0; i < pointClouds.length; i++) {
                pointClouds[i].visible = (i === index);
            }

            const buttons = document.getElementById('btn-container').children;
            for (let i = 0; i < buttons.length; i++) {
                buttons[i].classList.remove('active');
            }
            btnElement.classList.add('active');

            const ep = epochsData[index];
            document.getElementById('val-extracted-total').innerHTML = `${ep.ExtractedTotal.toLocaleString('ru-RU')} <span>м³</span>`;
            document.getElementById('stage-description').innerText = ep.Description;
        }

        function createPointCloud(buffer) {
            const POINT_STRIDE = 16;
            const numPoints = Math.floor(buffer.byteLength / POINT_STRIDE);
            
            const positions = new Float32Array(numPoints * 3);
            const colors = new Float32Array(numPoints * 3);
            const dataView = new DataView(buffer);
            
            let byteOffset = 0, pIdx = 0;

            for (let i = 0; i < numPoints; i++) {
                positions[pIdx]     = dataView.getFloat32(byteOffset, true);
                positions[pIdx + 1] = dataView.getFloat32(byteOffset + 4, true);
                positions[pIdx + 2] = dataView.getFloat32(byteOffset + 8, true);

                colors[pIdx]     = dataView.getUint8(byteOffset + 12) / 255.0;
                colors[pIdx + 1] = dataView.getUint8(byteOffset + 13) / 255.0;
                colors[pIdx + 2] = dataView.getUint8(byteOffset + 14) / 255.0;

                byteOffset += POINT_STRIDE;
                pIdx += 3;
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            return new THREE.Points(geometry, new THREE.PointsMaterial({ size: 0.045, vertexColors: true }));
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
