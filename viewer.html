<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Лидар-БИМ: 4D Мониторинг Выработки</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #121212; font-family: 'Segoe UI', sans-serif; color: #fff; }
        
        #dashboard {
            position: absolute; top: 20px; left: 20px; width: 340px;
            background: rgba(20, 25, 30, 0.9); border: 1px solid #334; border-radius: 8px;
            padding: 25px 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); backdrop-filter: blur(5px);
        }
        
        h2 { margin: 0 0 20px 0; font-size: 16px; color: #4DA8DA; text-transform: uppercase; border-bottom: 1px solid #334; padding-bottom: 15px; letter-spacing: 1px; }
        
        .metric { margin-bottom: 25px; padding: 15px; background: rgba(0, 230, 118, 0.1); border-left: 4px solid #00E676; border-radius: 4px; }
        .metric-label { font-size: 13px; color: #AAB; text-transform: uppercase; font-weight: bold; margin-bottom: 8px; }
        .metric-value { font-size: 32px; font-weight: bold; color: #00E676; text-shadow: 0 0 10px rgba(0, 230, 118, 0.3); }
        .metric-value span { font-size: 16px; color: #889; font-weight: normal; }
        
        .filename-text { font-size: 11px; color: #667; margin-top: 10px; display: block; text-align: right; }

        .controls { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; max-height: 300px; overflow-y: auto; }
        button {
            padding: 12px 15px; background: #2A3644; border: 1px solid #445; text-align: left;
            color: #fff; border-radius: 4px; cursor: pointer; font-weight: bold; transition: all 0.2s ease;
            display: flex; justify-content: space-between; align-items: center;
        }
        button:hover { background: #3B4D61; border-color: #556; }
        button.active { background: #4DA8DA; color: #000; border-color: #4DA8DA; box-shadow: 0 0 15px rgba(77, 168, 218, 0.4); }
        button .status { font-size: 11px; opacity: 0.7; }
        button.active .status { font-weight: bolder; opacity: 1; }

        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 18px; background: rgba(0, 0, 0, 0.8); padding: 20px 40px;
            border-radius: 8px; border: 1px solid #4DA8DA; z-index: 100;
            box-shadow: 0 0 20px rgba(77, 168, 218, 0.2);
        }
    </style>
</head>
<body>

    <div id="loading">Загрузка и синхронизация сканов...</div>

    <div id="dashboard" style="display: none;">
        <h2>Сводка горных работ</h2>
        
        <div class="metric">
            <div class="metric-label">Объем извлеченной породы</div>
            <div class="metric-value" id="val-extracted-total">0.00 <span>м³</span></div>
            <span class="filename-text" id="val-filename">Базовая Эпоха 0</span>
        </div>

        <div class="controls" id="btn-container">
            <!-- Кнопки генерируются динамически -->
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        let scene, camera, renderer, controls;
        let epochsData = [];
        let pointClouds = []; 

        init();
        loadData();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(15, 15, 15);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            const grid = new THREE.GridHelper(40, 40, 0x333344, 0x111118);
            scene.add(grid);

            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        async function loadData() {
            try {
                const metaResponse = await fetch('meta.json');
                if (!metaResponse.ok) throw new Error("Файл метаданных не найден.");
                const metaJson = await metaResponse.json();
                epochsData = metaJson.Epochs;

                const btnContainer = document.getElementById('btn-container');

                const fetchPromises = epochsData.map(ep => fetch(ep.BinFile).then(res => res.arrayBuffer()));
                const buffers = await Promise.all(fetchPromises);

                for (let i = 0; i < epochsData.length; i++) {
                    const ep = epochsData[i];
                    
                    const cloud = createPointCloud(buffers[i]);
                    cloud.visible = (i === 0); 
                    scene.add(cloud);
                    pointClouds.push(cloud);

                    const btn = document.createElement('button');
                    const labelSpan = document.createElement('span');
                    labelSpan.innerText = `Эпоха ${ep.Id}`;
                    
                    const statusSpan = document.createElement('span');
                    statusSpan.className = 'status';
                    statusSpan.innerText = i === 0 ? "БАЗИС" : `+${ep.ExtractedTotal.toLocaleString('ru-RU')} м³`;
                    
                    btn.appendChild(labelSpan);
                    btn.appendChild(statusSpan);
                    
                    if (i === 0) btn.classList.add('active');
                    
                    btn.onclick = () => selectEpoch(i, btn);
                    btnContainer.appendChild(btn);
                }

                if (pointClouds.length > 0) {
                    pointClouds[0].geometry.computeBoundingSphere();
                    const center = pointClouds[0].geometry.boundingSphere.center;
                    controls.target.copy(center);
                    controls.update();
                    
                    selectEpoch(0, btnContainer.firstElementChild); 
                }

                document.getElementById('loading').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';

            } catch (error) {
                document.getElementById('loading').innerText = "Ошибка: " + error.message;
                document.getElementById('loading').style.borderColor = "#FF3333";
            }
        }

        function selectEpoch(index, btnElement) {
            for (let i = 0; i < pointClouds.length; i++) {
                pointClouds[i].visible = (i === index);
            }

            const buttons = document.getElementById('btn-container').children;
            for (let i = 0; i < buttons.length; i++) {
                buttons[i].classList.remove('active');
            }
            btnElement.classList.add('active');

            const ep = epochsData[index];
            document.getElementById('val-extracted-total').innerHTML = `${ep.ExtractedTotal.toLocaleString('ru-RU')} <span>м³</span>`;
            document.getElementById('val-filename').innerText = `Источник: ${ep.Name}`;
        }

        function createPointCloud(buffer) {
            const POINT_STRIDE = 16;
            const numPoints = Math.floor(buffer.byteLength / POINT_STRIDE);
            
            const positions = new Float32Array(numPoints * 3);
            const colors = new Float32Array(numPoints * 3);
            const dataView = new DataView(buffer);
            
            let byteOffset = 0, pIdx = 0;

            for (let i = 0; i < numPoints; i++) {
                positions[pIdx]     = dataView.getFloat32(byteOffset, true);
                positions[pIdx + 1] = dataView.getFloat32(byteOffset + 4, true);
                positions[pIdx + 2] = dataView.getFloat32(byteOffset + 8, true);

                colors[pIdx]     = dataView.getUint8(byteOffset + 12) / 255.0;
                colors[pIdx + 1] = dataView.getUint8(byteOffset + 13) / 255.0;
                colors[pIdx + 2] = dataView.getUint8(byteOffset + 14) / 255.0;

                byteOffset += POINT_STRIDE;
                pIdx += 3;
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            return new THREE.Points(geometry, new THREE.PointsMaterial({ size: 0.04, vertexColors: true }));
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
