name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  PROJECT: MyProjectName.csproj   # подставьте имя вашего .csproj

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Self-test
        run: dotnet run --project ${{ env.PROJECT }} -c Release -- --selftest

      - name: Publish single-file exe (MSBuild creates the zip)
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish ${{ env.PROJECT }} -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -p:Version=$version -o publish

      - name: Verify package contents
        shell: pwsh
        run: |
          foreach ($p in 'publish/DroneLiDAR.exe','publish/viewer.html','publish/web','publish/THIRD-PARTY-NOTICES.txt') {
            if (-not (Test-Path $p)) { throw "Missing in publish: $p" }
          }
          if (-not (Test-Path bin/Release/net10.0/win-x64/DroneLiDAR_Release.zip)) { throw "Zip not created" }
          $dlls = (Get-ChildItem publish -Filter *.dll).Count
          if ($dlls -gt 0) { Write-Warning "Found $dlls loose .dll files in publish" }
          "{0:N1} MB exe" -f ((Get-Item publish/DroneLiDAR.exe).Length / 1MB)

      - name: Name and hash the archive
        shell: pwsh
        run: |
          $name = "DroneLiDAR-${{ github.ref_name }}-win-x64.zip"
          Copy-Item bin/Release/net10.0/win-x64/DroneLiDAR_Release.zip $name
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File "$name.sha256" -Encoding ascii

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          "DroneLiDAR-${{ github.ref_name }}-win-x64.zip"
          "DroneLiDAR-${{ github.ref_name }}-win-x64.zip.sha256"
          --title "DroneLiDAR ${{ github.ref_name }}"
          --generate-notes