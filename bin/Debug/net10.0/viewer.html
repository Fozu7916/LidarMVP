<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Лидар-БИМ: Визуализация облака точек (Three.js)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: sans-serif;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 14px;
            pointer-events: none;
            z-index: 100;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px 30px;
            border-radius: 8px;
            z-index: 200;
        }
    </style>
</head>
<body>
    <div id="info">
        <h3>Лидар-БИМ Просмотр</h3>
        <p>Левая кнопка мыши + движение: Вращение</p>
        <p>Правая кнопка мыши + движение: Смещение (Pan)</p>
        <p>Колесико мыши: Масштаб (Zoom)</p>
    </div>
    <div id="loading">Загрузка мастер-облака точек...</div>

    <!-- Подключаем Three.js и OrbitControls через надежный CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        let scene, camera, renderer, controls;

        init();
        animate();

        function init() {
            // Создаем сцену
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111111);

            // Настройка камеры с корректными плоскостями отсечения (защита от багов зума в Chrome)
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 1000.0);
            camera.position.set(15, 10, 15);

            // Рендерер с поддержкой плавности
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            // Управление орбитой
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 0.1;
            controls.maxDistance = 200.0;

            // Добавляем сетку для ориентации в пространстве
            const gridHelper = new THREE.GridHelper(30, 30, 0x444444, 0x222222);
            gridHelper.position.y = 0;
            scene.add(gridHelper);

            // Загружаем файл облака точек (.xyz)
            loadXyzFile('global_master_map.xyz');

            // Обработка изменения размера окна
            window.addEventListener('resize', onWindowResize, false);
        }

        function loadXyzFile(url) {
            fetch(url)
                .then(response => {
                    if (!response.ok) throw new Error("Файл .xyz не найден или сервер не смог его отдать.");
                    return response.text();
                })
                .then(text => {
                    const lines = text.split('\n');
                    const positions = [];
                    const colors = [];

                    for (let i = 0; i < lines.length; i++) {
                        const line = lines[i].trim();
                        if (!line) continue;

                        const parts = line.split(/\s+/);
                        if (parts.length >= 6) {
                            // Координаты X, Y, Z
                            positions.push(parseFloat(parts[0]), parseFloat(parts[1]), parseFloat(parts[2]));
                            // Цвета R, G, B (нормализуем от 0 до 1)
                            colors.push(parseInt(parts[3]) / 255, parseInt(parts[4]) / 255, parseInt(parts[5]) / 255);
                        }
                    }

                    const geometry = new THREE.BufferGeometry();
                    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
                    geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

                    // Материал точек
                    const material = new THREE.PointsMaterial({
                        size: 0.04,
                        vertexColors: true
                    });

                    const pointCloud = new THREE.Points(geometry, material);
                    scene.add(pointCloud);

                    // Центрируем камеру по центру масс облака точек
                    geometry.computeBoundingSphere();
                    const center = geometry.boundingSphere.center;
                    controls.target.copy(center);
                    camera.position.set(center.x + 10, center.y + 8, center.z + 10);
                    controls.update();

                    // Убираем экран загрузки
                    document.getElementById('loading').style.display = 'none';
                })
                .catch(error => {
                    console.error(error);
                    document.getElementById('loading').innerText = "Ошибка: не удалось загрузить global_master_map.xyz. Сначала выполните сборку в консоли!";
                    document.getElementById('loading').style.background = "rgba(150, 0, 0, 0.9)";
                });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
